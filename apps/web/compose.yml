name: lumate-web

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${API_UPSTREAM_URL:-http://lumate-api:8000/api}
    image: lumate-web:${IMAGE_TAG:-local}
    container_name: lumate-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3003}:3001"
    networks: [lumate]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

networks:
  lumate:
    external: true
    name: lumate-network
